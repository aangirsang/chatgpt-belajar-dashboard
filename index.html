<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Dashboard</title>

    <!-- Material Symbols -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp" />

    <!-- Panggil CSS -->
    <link rel="stylesheet" href="css/variable.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/page.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/pengguna.css">
    <link rel="stylesheet" href="css/master-data.css">
    <link rel="stylesheet" href="css/umkm.css">
</head>
<body>
    <div class="container">
        <aside>
            <!-------------------- LOGO -------------------->
            <div class="top">
                <div class="logo">
                    <img src="./images/Logo-RB.png" alt="Logo RB">
                    <div class="logo-text">
                        <h2><span class="rb-1">Rumah</span></h2>
                        <h1><span class="rb-2">BUMN</span></h1>
                        <h3><span class="rb-3">Batu Bara</span></h3>
                    </div>
                </div>
                <div class="close" id="close-btn">
                    <span class="material-symbols-sharp">close</span>
                </div>
            </div>
            <!-------------------- SIDEBAR -------------------->
            <div class="sidebar">
                <a onclick="loadPage('dashboard')" class="active">
                    <span class="material-symbols-sharp">grid_view</span>
                    <h3>Dashboard</h3>
                </a>

                <a onclick="toggleSubmenu('produk-submenu', 'produk-arrow')" class="menu-item">
                    <span class="material-symbols-sharp">inventory</span>
                    <h3>Master</h3>
                    <span id="produk-arrow" class="material-symbols-sharp">expand_more</span>
                </a>

                <div class="submenu" id="produk-submenu">
                    <a onclick="loadPage('pengguna')">
                        <span></span>
                        <h4>Pengguna</h4>
                    </a>
                    <a onclick="loadPage('master-data')">
                        <span></span>
                        <h4>Master Data</h4>
                    </a>
                    <a onclick="loadPage('pembelian')">
                        <span></span>
                        <h4>Pembelian</h4>
                    </a>
                </div>

                <a onclick="toggleSubmenu('umkm-submenu', 'umkm-arrow')" class="menu-item">
                    <span class="material-symbols-sharp">inventory</span>
                    <h3>UMKM</h3>
                    <span id="umkm-arrow" class="material-symbols-sharp">expand_more</span>

                </a>

                <div class="submenu" id="umkm-submenu">
                    <a onclick="loadPage('umkm')">
                        <span></span>
                        <h4>UMKM</h4>
                    </a>
                    <a onclick="loadPage('stiker')">
                        <span></span>
                        <h4>Stiker</h4>
                    </a>
                </div>

                <a onclick="loadPage('produk')">
                    <span class="material-symbols-sharp">inventory</span>
                    <h3>Produk</h3>
                </a>
                <a onclick="loadPage('pelanggan')">
                    <span class="material-symbols-sharp">person</span>
                    <h3>Pelanggan</h3>
                </a>
                <a onclick="loadPage('laporan')">
                    <span class="material-symbols-sharp">inventory</span>
                    <h3>Laporan</h3>
                </a>
                <a class="last">
                    <span class="material-symbols-sharp">logout</span>
                    <h3>Logout</h3>
                </a>
            </div>
        </aside>

        <!-------------------- MAIN -------------------->
        <main class="main">
            <!--NAVBAR-->
            <header class="navbar">
                <h1 id="page-title">Dashboard</h1>
                <div class="kanan">
                    <button id="menu-btn">
                        <span class="material-symbols-sharp">menu</span>
                    </button>
                    <div class="theme-toggler">
                        <span class="material-symbols-sharp active">light_mode</span>
                        <span class="material-symbols-sharp">dark_mode</span>
                    </div>
                    <!--PROFILE ACCOUNT-->
                    <div id="profile-container"></div>
                </div>
            </header>

            <!--CONTENT-->
            <section id="content" class="content">

            </section>
        </main>
    </div>

    <!-- Panggil JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/index.js"></script>
    <script src="js/master-data.js"></script>
    <script src="js/pengguna.js"></script>
    <script src="js/umkm.js"></script>
</body>
</html>
