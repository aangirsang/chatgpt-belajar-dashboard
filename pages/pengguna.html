<div class="pengguna">
    <!-- SEARCH -->
    <div class="search-bar">
        <div class="search-box">
            <span class="material-symbols-sharp">search</span>
            <label>
                <input type="text" id="cari-pengguna" placeholder="Cari Data Pengguna">
            </label>
        </div>
        <button class="add-btn" id="add-btn">
            <span class="material-symbols-sharp">add</span>
            Tambah Pengguna
        </button>
    </div>

    <!-- TABLE -->
    <div class="table-container">
        <table class="pengguna-tbl">
            <thead>
            <tr>
                <th>Nama Lengkap</th>
                <th>Nama  Akun</th>
                <th>Level</th>
                <th>Status</th>
                <th>Edit</th>
            </tr>
            </thead>
            <tbody id="pengguna-tbl-body"></tbody>
        </table>
    </div>

    <!--POPUP HAPUS-->
    <div id="popup-hapus" class="popup">
        <div class="popup-content-hapus">
            <h2>Konfirmasi</h2>
            <p>Yakin ingin menghapus pengguna?</p>
            <div class="popup-actions">
                <button id="konfirmasi-hapus-btn">Hapus</button>
                <button id="batal-btn">Batal</button>
            </div>
        </div>
    </div>

    <!--POPUP PENGGUNA-->
    <div id="popup-edit" class="popup">
        <div class="popup-content-edit">
            <h2>Edit Pengguna</h2>

            <form id="form-edit-pengguna">
                <div class="form-grid">
                    <div class="form-left">
                        <div class="form-group">
                            <label>Nama</label>
                            <label for="edit-nama">

                            </label>
                            <input type="text" id="edit-nama">
                        </div>

                        <div class="form-group">
                            <label for="edit-akun">Akun</label>
                            <input type="text" id="edit-akun">
                        </div>

                        <div class="form-group">
                            <label>Level</label>
                            <div class="custom-select" id="customSelect">
                                <div class="select-box" id="selectBox">
                                    <span id="selectedText"></span>
                                    <span class="arrow" id="arrow">▼</span>
                                </div>

                                <div class="options" id="optionsList"></div>

                                <input type="hidden" id="selectedValue">
                            </div>
                        </div>

                        <div class="form-group-radio">
                            <label>Status</label>
                            <div class="radio-group">
                                <label class="radio-item">
                                    <input
                                            type="radio"
                                            name="status"
                                            value="true"
                                    >
                                    <span>Aktif</span>
                                </label>

                                <label class="radio-item">
                                    <input
                                            type="radio"
                                            name="status"
                                            value="false"
                                    >
                                    <span>Non-Aktif</span>
                                </label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="kata-sandi">Akun</label>
                            <div class="password-box">
                                <input
                                        type="password"
                                        id="kata-sandi"
                                        placeholder="Masukkan kata sandi"
                                >

                                <button
                                        type="button"
                                        class="toggle-password"
                                        onclick="togglePassword('kata-sandi',this)"
                                >
                                    <span class="material-symbols-sharp">visibility</span>
                                </button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="ulangi-kata-sandi">Akun</label>
                            <div class="password-box">
                                <input
                                        type="password"
                                        id="ulangi-kata-sandi"
                                        placeholder="Masukkan kata sandi"
                                >

                                <button
                                        type="button"
                                        class="toggle-password"
                                        onclick="togglePassword('ulangi-kata-sandi',this)"
                                >
                                    <span class="material-symbols-sharp">visibility</span>
                                </button>
                            </div>
                        </div>

                    </div>

                    <div class="form-right">
                        <!-- Preview -->
                        <div class="image-box">
                            <img id="previewImage" alt="Foto Pengguna">
                        </div>

                        <!-- Tombol Cari -->
                        <button type="button" onclick="openExplorer()">Cari Gambar</button>

                        <!-- Input File -->
                        <div class="input-file">
                            <input type="file" id="fileInput" accept="image/*" hidden>
                        </div>
                    </div>
                </div>

                <div class="popup-actions">
                    <button type="submit" id="simpan-edit-btn">Simpan</button>
                    <button type="button" id="batal-edit-btn">Batal</button>
                </div>

            </form>
        </div>
    </div>
</div>
