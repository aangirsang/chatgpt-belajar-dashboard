<div class="umkm">
    <!-- SEARCH -->
    <div class="search-bar">
        <div class="search-box">
            <span class="material-symbols-sharp">search</span>
            <label>
                <input type="text" placeholder="Cari Data UMKM">
            </label>
        </div>
        <button class="add-btn" id="add-UMKM-btn">
            <span class="material-symbols-sharp">add</span>
            Tambah Anggota UMKM
        </button>
    </div>

    <!-- TABLE -->
    <div class="table-container">
        <div class="tabel-card">
            <table class="umkm-tbl">
                <thead>
                <tr>
                    <th onclick="sortTable('namaUsaha')">Nama Usaha</th>
                    <th onclick="sortTable('namaPemilik')">Nama  Pemilik</th>
                    <th onclick="sortTable('noTelep')">Telepon</th>
                    <th onclick="sortTable('alamat')">Alamat</th>
                    <th onclick="sortTable('kategori')">Kategori</th>
                    <th onclick="sortTable('status')">Status</th>
                </tr>
                </thead>
                <tbody id="umkm-tbl-body"></tbody>
            </table>
        </div>
        <div id="pagination" class="pagination"></div>
    </div>

    <!--POPUP HAPUS-->
    <div id="popup-hapus-umkm" class="popup">
        <div class="popup-content-hapus">
            <h2>Konfirmasi</h2>
            <p>Yakin ingin menghapus pengguna?</p>
            <div class="popup-actions">
                <button id="konfirmasi-hapus-btn">Hapus</button>
                <button id="batal-hapus-btn">Batal</button>
            </div>
        </div>
    </div>

    <!-- POPUP UMKM -->
    <div class="popup" id="popup-edit-umkm">
        <div class="popup-content-umkm">
            <form id="form-edit-umkm">
                <h2>Data UMKM</h2>
                <div class="form-umkm-grid">
                    <div class="form-umkm-kiri">
                        <h3>Data Usaha</h3>
                        <div class="form-group">
                            <label for="umkm-nama-usaha">Nama Usaha</label>
                            <input type="text" id="umkm-nama-usaha" placeholder="Masukkan nama usaha">
                        </div>
                        <div class="form-group">
                            <label>Kategori Usaha</label>
                            <div class="custom-select" id="selectUmkmKategori" >
                                <div class="select-box" id="selectBoxUmkmKategori" >
                                    <span id="selectedText" class="empty">Pilih kategori usaha</span>
                                    <span class="arrow" id="arrow">▼</span>
                                </div>

                                <div class="options" id="optionsListUmkmKategori"></div>

                                <input type="hidden" id="selectedValueUmkmKategori">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="umkm-deskripsi-usaha">Deskripsi Usaha</label>

                            <textarea
                                    id="umkm-deskripsi-usaha"
                                    rows="6"
                                    placeholder="Masukkan deskripsi usaha">
                            </textarea>
                        </div>
                        <div class="form-group-radio">
                            <label>Status</label>
                            <div class="radio-group" id="group-status">
                                <label class="radio-item">
                                    <input
                                            type="radio"
                                            name="status"
                                            value="true"
                                    >
                                    <span>Aktif</span>
                                </label>

                                <label class="radio-item">
                                    <input
                                            type="radio"
                                            name="status"
                                            value="false"
                                    >
                                    <span>Non-Aktif</span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="form-umkm-tengah">
                        <h3>Data Pemilik</h3>
                        <div class="form-group">
                            <label for="umkm-nama-pemilik">Nama Pemilik</label>
                            <input type="text" id="umkm-nama-pemilik" placeholder="Masukkan nama pemilik usaha">
                        </div>
                        <div class="form-group">
                            <label for="umkm-ktp">Nomor Identitas/KTP</label>
                            <input type="text" id="umkm-ktp" placeholder="Masukkan Nomor Identitas/KTP">
                        </div>
                        <div class="form-group-radio">
                            <label>Jenis Kelamin</label>
                            <div class="radio-group" id="group-jenis-kelamin">
                                <label class="radio-item">
                                    <input type="radio" name="jenis-kelamin" value="true">
                                    <span>Laki-Laki</span>
                                </label>

                                <label class="radio-item">
                                    <input type="radio" name="jenis-kelamin" value="false">
                                    <span>Perempuan</span>
                                </label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="umkm-tanggal-lahir">Tanggal Lahir</label>
                            <input type="date" id="umkm-tanggal-lahir" placeholder="Masukkan tanggal lahir">
                        </div>
                        <div class="form-group">
                            <label for="umkm-alamat">Alamat Lengkap</label>

                            <textarea
                                    id="umkm-alamat"
                                    rows="4"
                                    placeholder="Masukkan alamat lengkap">
                            </textarea>
                        </div>


                    </div>
                    <div class="form-umkm-kanan">
                        <h3>Kontak</h3>
                        <div class="form-group">
                            <label for="umkm-email">Alamat Email</label>
                            <input type="text" id="umkm-email" placeholder="Masukkan alamat email">
                        </div>
                        <div class="form-group">
                            <label for="umkm-telp">Nomor Telepon</label>
                            <input type="text" id="umkm-telp" placeholder="Masukkan nomor telepon">
                        </div>
                        <div class="form-group">
                            <label for="umkm-wa">WhatsApp</label>
                            <input type="text" id="umkm-wa" placeholder="Masukkan nomor whatsapp">
                        </div>
                        <div class="form-group">
                            <label for="umkm-instagram">Instagram</label>
                            <input type="text" id="umkm-instagram" placeholder="Masukkan akun instagram">
                        </div>
                        <div class="form-group">
                            <label for="umkm-facebook">Facebook</label>
                            <input type="text" id="umkm-facebook" placeholder="Masukkan akun Facebook">
                        </div>
                    </div>
                </div>
                <div class="popup-actions">
                    <button type="submit" id="simpan-umkm-btn">Simpan</button>
                    <button type="button" id="batal-umkm-btn">Batal</button>
                </div>
            </form>
        </div>
    </div>
</div>
